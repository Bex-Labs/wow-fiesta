<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donations — WoW Fiesta Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="WoW Logo" />
      <span>WoW Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="events.html" class="nav-item">
        <span class="nav-icon">📅</span><span>Events</span>
      </a>
      <a href="registrations.html" class="nav-item">
        <span class="nav-icon">🎟</span><span>Registrations</span>
      </a>
      <a href="donations.html" class="nav-item active">
        <span class="nav-icon">💛</span><span>Donations</span>
      </a>
      <a href="gallery.html" class="nav-item">
        <span class="nav-icon">🖼</span><span>Gallery</span>
      </a>
      <a href="blog.html" class="nav-item">
        <span class="nav-icon">✍️</span><span>Blog</span>
      </a>
      <a href="about.html" class="nav-item">
        <span class="nav-icon">ℹ️</span><span>About</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item" target="_blank">
        <span class="nav-icon">🌐</span><span>View Site</span>
      </a>
      <button class="nav-item logout-btn" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h2 class="page-title">Donations</h2>
      <div class="topbar-right">
        <button class="btn-export" onclick="exportDonationsCSV()">
          ⬇ Export CSV
        </button>
      </div>
    </div>

    <!-- Stats Strip -->
    <div class="reg-stats-strip">
      <div class="reg-stat-card">
        <span class="reg-stat-icon">💛</span>
        <div>
          <p class="reg-stat-num" id="don-total">—</p>
          <p class="reg-stat-label">Total Donations</p>
        </div>
      </div>
      <div class="reg-stat-card">
        <span class="reg-stat-icon">💰</span>
        <div>
          <p class="reg-stat-num" id="don-revenue">—</p>
          <p class="reg-stat-label">Total Raised</p>
        </div>
      </div>
      <div class="reg-stat-card">
        <span class="reg-stat-icon">📈</span>
        <div>
          <p class="reg-stat-num" id="don-average">—</p>
          <p class="reg-stat-label">Average Donation</p>
        </div>
      </div>
      <div class="reg-stat-card">
        <span class="reg-stat-icon">🏆</span>
        <div>
          <p class="reg-stat-num" id="don-highest">—</p>
          <p class="reg-stat-label">Highest Donation</p>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <input
        type="text"
        id="don-search"
        placeholder="Search by name or email..."
        oninput="filterDonations()"
        class="filter-input"
      />
    </div>

    <!-- Table -->
    <div class="admin-section">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Amount</th>
              <th>Payment Ref</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="don-tbody">
            <tr>
              <td colspan="7" class="table-loading">
                Loading donations...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="table-count" id="don-count"></p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script src="js/donations-admin.js"></script>

</body>
</html>
