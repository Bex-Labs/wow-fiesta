<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — WoW Fiesta Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="WoW Logo" />
      <span>WoW Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="events.html" class="nav-item">
        <span class="nav-icon">📅</span><span>Events</span>
      </a>
      <a href="registrations.html" class="nav-item">
        <span class="nav-icon">🎟</span><span>Registrations</span>
      </a>
      <a href="gallery.html" class="nav-item">
        <span class="nav-icon">🖼</span><span>Gallery</span>
      </a>
      <a href="blog.html" class="nav-item">
        <span class="nav-icon">✍️</span><span>Blog</span>
      </a>
      <a href="about.html" class="nav-item active">
        <span class="nav-icon">ℹ️</span><span>About</span>
      </a>
      <a href="donations.html" class="nav-item">
  <span class="nav-icon">💛</span><span>Donations</span>
</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item" target="_blank">
        <span class="nav-icon">🌐</span><span>View Site</span>
      </a>
      <button class="nav-item logout-btn" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h2 class="page-title">Edit About Section</h2>
    </div>

    <div class="admin-section">
      <p class="section-desc">
        Changes here update the public site immediately.
      </p>

      <div class="form-group">
        <label>Hero Description</label>
        <textarea id="hero-description" rows="3"
          placeholder="The text under Experience the Magic!">
        </textarea>
      </div>

      <div class="form-group">
        <label>About Section Heading</label>
        <input type="text" id="about-heading"
          placeholder="e.g. Fun for Everyone" />
      </div>

      <div class="form-group">
        <label>About Section Body Text</label>
        <textarea id="about-body" rows="5"
          placeholder="The main about section description">
        </textarea>
      </div>

      <div class="save-bar">
        <button class="btn-save" onclick="saveAboutContent()">
          Save Changes
        </button>
        <span class="save-status" id="save-status"></span>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
