<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — WoW Fiesta Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="WoW Logo" />
      <span>WoW Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="events.html" class="nav-item active">
        <span class="nav-icon">📅</span><span>Events</span>
      </a>
      <a href="registrations.html" class="nav-item">
        <span class="nav-icon">🎟</span><span>Registrations</span>
      </a>
      <a href="gallery.html" class="nav-item">
        <span class="nav-icon">🖼</span><span>Gallery</span>
      </a>
      <a href="blog.html" class="nav-item">
        <span class="nav-icon">✍️</span><span>Blog</span>
      </a>
      <a href="about.html" class="nav-item">
        <span class="nav-icon">ℹ️</span><span>About</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item" target="_blank">
        <span class="nav-icon">🌐</span><span>View Site</span>
      </a>
      <button class="nav-item logout-btn" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h2 class="page-title">Manage Events</h2>
      <div class="topbar-right">
        <button class="btn-primary-sm" onclick="openAddEvent()">
          + Add Event
        </button>
      </div>
    </div>

    <div class="admin-section">
      <p class="section-desc">
        Edit event details below. Changes update
        live on the public website immediately.
      </p>
      <div class="events-grid" id="events-grid">
        <p class="table-loading">Loading events...</p>
      </div>
    </div>

    <!-- Edit Event Modal -->
    <div class="modal-overlay" id="event-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">Edit Event</h3>
          <button class="modal-close"
            onclick="closeEventModal()">✕</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="event-id" />

          <div class="form-group">
            <label>City</label>
            <input type="text" id="event-city"
              placeholder="e.g. Lagos" />
          </div>
          <div class="form-group">
            <label>Venue Name</label>
            <input type="text" id="event-venue-name"
              placeholder="e.g. Ikeja, Lagos" />
          </div>
          <div class="form-group">
            <label>Full Venue Address</label>
            <input type="text" id="event-venue-address"
              placeholder="Full address" />
          </div>
          <div class="form-group">
            <label>Event Date</label>
            <input type="date" id="event-date" />
          </div>
          <div class="form-group">
            <label>Event Time</label>
            <input type="text" id="event-time"
              placeholder="e.g. 10:00 AM – 6:00 PM" />
          </div>
          <div class="form-group">
            <label>Adult Price (₦)</label>
            <input type="number" id="event-price"
              placeholder="e.g. 3000" />
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="event-active">
              <option value="true">Active — visible on site</option>
              <option value="false">Hidden — not visible</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel"
            onclick="closeEventModal()">Cancel</button>
          <button class="btn-save"
            onclick="saveEvent()">Save Changes</button>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
